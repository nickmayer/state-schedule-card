name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Create release with the card attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/state-schedule-card.js
          generate_release_notes: true
